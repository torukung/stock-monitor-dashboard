name: sensor-scan

# Mover-sensor tape scan. Runs every weekday at 12:30 UTC (19:30 Bangkok) —
# after SET's 16:30 close with margin for EODHD to publish the day's EOD bar,
# and before the 13:00 UTC daily-update job.
on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}        # run manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mover sensor (Tier A + watch-file Tier B)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python sensor/sensor_scan.py

      - name: Commit sensor report
        run: |
          git config user.name  "stock-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sensor/sensor_report.json
          git commit -m "sensor scan $(date -u +%F)" || echo "no changes"
          git push

      # Optional phone push via ntfy.sh — inert until you add an NTFY_TOPIC
      # repo secret (pick a long random topic name, subscribe to it in the
      # ntfy app). Only fires when something ALERTs or flags.
      - name: Push alerts to phone (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set — skipping"; exit 0; fi
          MSG=$(python - <<'EOF'
          import json
          r = json.load(open("sensor/sensor_report.json"))["results"]
          hot = [x for x in r if x["alert"] or x["private_channel_flag"] or x.get("ignition")]
          lines = []
          for x in hot[:6]:
              tag = "ALERT" if x["alert"] else ("FLAG" if x["private_channel_flag"] else "IGNITION")
              lines.append(f'{tag} {x["ticker"]} {x["score"]:.1f} @ {x["last"]}')
          print("\n".join(lines))
          EOF
          )
          if [ -n "$MSG" ]; then
            curl -s -H "Title: SET mover sensor" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC"
          else
            echo "quiet tape — no push"
          fi
